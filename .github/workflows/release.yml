name: Release download

# Builds the small download (Nabd.zip: only what is needed to run) and attaches it to a release.
# Runs by itself when a release is published; can also be run by hand for an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to attach Nabd.zip to (e.g. v1.0.0)"
        required: true
      ref:
        description: "Branch, tag or commit to build from (empty = the release's tag)"
        required: false

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Build Nabd.zip
        run: python tools/build_release.py dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Nabd.zip --clobber --repo "$GITHUB_REPOSITORY"
